services:
  jenkins:
    build:
      context: .
      dockerfile: Dockerfile.jenkins
    container_name: kijanikiosk-jenkins
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "50000:50000"
    group_add:
      - "${DOCKER_GID}"
    environment:
      JAVA_OPTS: "-Xms256m -Xmx512m"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    mem_limit: 768m
    depends_on:
      - nexus

  nexus:
    image: sonatype/nexus3:3.77.1
    container_name: kijanikiosk-nexus
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      INSTALL4J_ADD_VM_PARAMS: "-Xms256m -Xmx512m -XX:MaxDirectMemorySize=256m"
    volumes:
      - nexus_data:/nexus-data
    mem_limit: 1024m

volumes:
  jenkins_home:
  nexus_data:
